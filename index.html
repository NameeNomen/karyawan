<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Lost - Dino Run</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* --- CSS STYLES --- */
        :root {
            --bg-color: #f7f7f7;
            --game-color: #535353; /* Warna abu-abu gelap khas dino chrome */
            --accent-color: #acacac;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Press Start 2P', cursive;
            user-select: none; /* Mencegah seleksi teks saat bermain */
        }

        body {
            height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background-color: var(--bg-color);
            flex-direction: column;
        }

        /* Wadah Utama Game */
        #game-container {
            width: 600px;
            height: 250px;
            border-bottom: 2px solid var(--game-color); /* Garis tanah */
            position: relative;
            background-color: var(--bg-color);
            overflow: hidden; /* Penting: menyembunyikan kaktus yang keluar layar */
        }

        /* --- Karakter Dino --- */
        #dino {
            width: 40px; /* Lebar hitbox */
            height: 45px; /* Tinggi hitbox */
            position: absolute;
            bottom: 0;
            left: 50px;
            /* Menggambar dino kotak sederhana dengan CSS */
            background-color: var(--game-color);
            /* Sedikit gaya pixel art sederhana */
            box-shadow: 4px -4px 0 0 var(--bg-color) inset; 
        }

        /* Kelas untuk animasi lompat */
        .animate-jump {
            animation: jump 0.5s linear;
        }

        @keyframes jump {
            0% { bottom: 0; }
            40% { bottom: 100px; } /* Titik tertinggi */
            60% { bottom: 100px; } /* Tahan sebentar di udara */
            100% { bottom: 0; }
        }

        /* --- Rintangan (Kaktus) --- */
        #cactus {
            width: 30px;
            height: 50px;
            position: absolute;
            bottom: 0;
            left: 600px; /* Mulai di luar layar kanan */
            background-color: var(--game-color);
            /* Gaya kaktus pixel sederhana */
            clip-path: polygon(20% 0%, 80% 0%, 100% 20%, 100% 100%, 0% 100%, 0% 20%);
        }

        /* Kelas untuk animasi kaktus bergerak */
        .animate-move {
            /* Bergerak dari kanan (600px) ke kiri (-40px) selama 1.5 detik */
            animation: moveCactus 1.5s infinite linear;
        }

        @keyframes moveCactus {
            from { left: 600px; }
            to { left: -40px; }
        }


        /* --- UI: Skor dan Pesan --- */
        #score {
            position: absolute;
            top: 10px; right: 20px;
            color: var(--game-color);
            font-size: 0.8rem;
        }

        #game-over-msg {
            display: none; /* Sembunyikan secara default */
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--game-color);
            z-index: 10;
        }

        #game-over-msg h2 { margin-top: 10px; font-size: 1.2rem; }
        #game-over-msg p { margin-top: 15px; font-size: 0.7rem; color: var(--accent-color); cursor: pointer; }
        #restart-icon { font-size: 2rem; cursor: pointer;}

        /* Header Halaman */
        .header-msg { margin-bottom: 30px; text-align: center; color: var(--game-color); }
        .header-msg h1 { font-size: 1.5rem; margin-bottom: 10px; }
        .header-msg p { font-size: 0.8rem; color: var(--accent-color); }
        .offline-icon { font-size: 3rem; margin-bottom: 20px; display: block; }

    </style>
</head>
<body>

    <div class="header-msg">
        <span class="offline-icon">🦖</span>
        <h1>Tidak ada internet</h1>
        <p>Coba periksa kabel jaringan, modem, dan router Anda.</p>
        <p style="margin-top: 20px; font-size: 0.6rem;">(Tekan Spasi untuk menghilangkan gabut)</p>
    </div>

    <div id="game-container">
        <div id="score">Score: 0</div>
        
        <div id="dino"></div>
        <div id="cactus"></div>

        <div id="game-over-msg">
            <div id="restart-icon">↻</div>
            <h2>GAME OVER</h2>
            <p>Tekan Spasi untuk Restart</p>
        </div>
    </div>


<script>
    /* --- JAVASCRIPT LOGIC --- */

    const dino = document.getElementById("dino");
    const cactus = document.getElementById("cactus");
    const scoreText = document.getElementById("score");
    const gameOverMsg = document.getElementById("game-over-msg");
    const gameContainer = document.getElementById("game-container");

    let isJumping = false;
    let isGameOver = true; // Game belum mulai
    let score = 0;
    let gameInterval;
    let scoreInterval;

    // Fungsi untuk Melompat
    function jump() {
        // Cegah lompat ganda atau lompat saat game over
        if (isJumping || isGameOver) return;

        isJumping = true;
        dino.classList.add("animate-jump");

        // Hapus kelas animasi setelah selesai (500ms sesuai durasi CSS)
        setTimeout(function () {
            dino.classList.remove("animate-jump");
            isJumping = false;
        }, 500);
    }

    // Fungsi Memulai Game
    function startGame() {
        if (!isGameOver) return; // Jika game sudah berjalan, jangan lakukan apa-apa

        isGameOver = false;
        score = 0;
        gameOverMsg.style.display = "none";
        cactus.classList.add("animate-move"); // Mulai gerakan kaktus

        // Interval untuk menambah skor
        scoreInterval = setInterval(() => {
            score++;
            scoreText.innerHTML = "Score: " + score;
        }, 100); // Tambah skor setiap 100ms

        // Interval Utama Game Loop (Cek Tabrakan)
        gameInterval = setInterval(checkCollision, 10);
    }


    // Fungsi Cek Tabrakan (Inti Game)
    function checkCollision() {
        // 1. Dapatkan posisi Dino saat ini (terutama posisi vertikal/top)
        // getComputedStyle mengembalikan nilai real-time dari CSS (misal: "150px")
        // parseInt mengubahnya jadi angka (150)
        let dinoTop = parseInt(window.getComputedStyle(dino).getPropertyValue("top"));

        // 2. Dapatkan posisi Kaktus saat ini (posisi horizontal/left)
        let cactusLeft = parseInt(window.getComputedStyle(cactus).getPropertyValue("left"));

        // 3. Logika Hitbox:
        // Kaktus berada di area horizontal Dino (antara 0 dan 40px dari kiri)
        // DAN Dino sedang di bawah (top lebih besar dari 200px, artinya dekat tanah)
        // *Catatan: Tinggi wadah 250px. Tinggi dino 45px. Jadi tanah adalah top=205px. 
        // Kalau top > 200 berarti dia belum cukup tinggi melompat.
        if (cactusLeft > 0 && cactusLeft < 40 && dinoTop > 200) {
            gameOver();
        }
    }

    // Fungsi Game Over
    function gameOver() {
        isGameOver = true;
        clearInterval(gameInterval); // Hentikan cek tabrakan
        clearInterval(scoreInterval); // Hentikan skor
        
        // Hentikan animasi kaktus
        cactus.classList.remove("animate-move");
        
        // Tampilkan pesan
        gameOverMsg.style.display = "block";
    }


    // --- EVENT LISTENERS (Kontrol) ---

    // Kontrol Keyboard (Spasi atau Panah Atas)
    document.addEventListener('keydown', function (event) {
        if (event.code === 'Space' || event.code === 'ArrowUp') {
            event.preventDefault(); // Mencegah scroll halaman
            if (isGameOver) {
                startGame();
            } else {
                jump();
            }
        }
    });

    // Kontrol Klik/Sentuh (Untuk HP atau klik mouse)
    gameContainer.addEventListener('click', function() {
        if (isGameOver) {
            startGame();
        } else {
            jump();
        }
    });

</script>

</body>
</html>
